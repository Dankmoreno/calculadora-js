name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancelan los que ya están en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Desplegar el sitio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
