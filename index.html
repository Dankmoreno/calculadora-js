<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Calculadora científica fx con entrada de expresiones, tema astrológico y sin dependencias.">
  <title>Astrolabio fx — calculadora científica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Capa puramente decorativa: campo estelar, órbitas, zodiaco y fórmulas. -->
  <div class="cosmos" aria-hidden="true">
    <div class="cosmos__estrellas"></div>
    <div class="cosmos__estrellas cosmos__estrellas--lento"></div>
    <div class="cosmos__nebulosa"></div>

    <div class="orbita orbita--1"></div>
    <div class="orbita orbita--2"></div>
    <div class="orbita orbita--3"><span class="planeta"></span></div>

    <div class="zodiaco">
      <span style="--i:0">♈</span><span style="--i:1">♉</span><span style="--i:2">♊</span>
      <span style="--i:3">♋</span><span style="--i:4">♌</span><span style="--i:5">♍</span>
      <span style="--i:6">♎</span><span style="--i:7">♏</span><span style="--i:8">♐</span>
      <span style="--i:9">♑</span><span style="--i:10">♒</span><span style="--i:11">♓</span>
    </div>

    <p class="flotante flotante--1">e<sup>iπ</sup> + 1 = 0</p>
    <p class="flotante flotante--2">T² = 4π²a³ / GM</p>
    <p class="flotante flotante--3">φ = (1 + √5) / 2</p>
    <p class="flotante flotante--4">∮ E · dA = Q / ε₀</p>
    <p class="flotante flotante--5">Δx · Δp ≥ ħ / 2</p>
    <p class="flotante flotante--6">c = 299 792 458 m/s</p>
  </div>

  <main class="fx">
    <header class="cartela">
      <span class="cartela__sello" aria-hidden="true">✦</span>
      <div>
        <h1 class="cartela__titulo">Astrolabio fx</h1>
        <p class="cartela__sub">científica · expresiones</p>
      </div>
    </header>

    <div class="visor">
      <div class="visor__barra">
        <span class="insignia insignia--viva" id="indicador-shift" hidden>SHIFT</span>
        <span class="insignia insignia--viva" id="indicador-memoria" hidden>M</span>
        <span class="aviso" id="aviso" role="status" aria-live="polite"></span>
        <button type="button" class="insignia insignia--boton" id="indicador-angulo"
                data-accion="angulo" aria-label="Unidad de ángulo. Pulsa para cambiar entre grados, radianes y gradianes">DEG</button>
        <button type="button" class="insignia insignia--boton" data-accion="copiar"
                aria-label="Copiar el resultado al portapapeles">Copiar</button>
      </div>

      <div class="visor__entrada" id="entrada" aria-label="Expresión en edición"></div>
      <output class="visor__resultado" id="resultado" role="status" aria-live="polite" aria-atomic="true"></output>
    </div>

    <div class="teclado teclado--funciones">
      <button type="button" class="tecla tecla--control" data-accion="shift" aria-label="Segunda función">SHIFT</button>
      <button type="button" class="tecla tecla--control" data-accion="angulo" aria-label="Cambiar unidad de ángulo">ANG</button>
      <button type="button" class="tecla tecla--control" data-accion="arriba" aria-label="Expresión anterior del historial">▲</button>
      <button type="button" class="tecla tecla--control" data-accion="abajo" aria-label="Expresión siguiente del historial">▼</button>
      <button type="button" class="tecla tecla--control" data-accion="izquierda" aria-label="Mover el cursor a la izquierda">◀</button>
      <button type="button" class="tecla tecla--control" data-accion="derecha" aria-label="Mover el cursor a la derecha">▶</button>

      <button type="button" class="tecla tecla--fn" data-ins="⁻¹" data-ins-shift="abs(" aria-label="Inverso. Con SHIFT, valor absoluto">
        <span class="tecla__alt" aria-hidden="true">abs</span><span>x⁻¹</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="²" aria-label="Elevar al cuadrado">x²</button>
      <button type="button" class="tecla tecla--fn" data-ins="³" aria-label="Elevar al cubo">x³</button>
      <button type="button" class="tecla tecla--fn" data-ins="^" aria-label="Elevar a la potencia">xʸ</button>
      <button type="button" class="tecla tecla--fn" data-ins="√" aria-label="Raíz cuadrada">√</button>
      <button type="button" class="tecla tecla--fn" data-ins="∛" aria-label="Raíz cúbica">∛</button>

      <button type="button" class="tecla tecla--fn" data-ins="sin(" data-ins-shift="sin⁻¹(" aria-label="Seno. Con SHIFT, arcoseno">
        <span class="tecla__alt" aria-hidden="true">sin⁻¹</span><span>sin</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="cos(" data-ins-shift="cos⁻¹(" aria-label="Coseno. Con SHIFT, arcocoseno">
        <span class="tecla__alt" aria-hidden="true">cos⁻¹</span><span>cos</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="tan(" data-ins-shift="tan⁻¹(" aria-label="Tangente. Con SHIFT, arcotangente">
        <span class="tecla__alt" aria-hidden="true">tan⁻¹</span><span>tan</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="ln(" data-ins-shift="e^(" aria-label="Logaritmo natural. Con SHIFT, e elevado a x">
        <span class="tecla__alt" aria-hidden="true">eˣ</span><span>ln</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="log(" data-ins-shift="10^(" aria-label="Logaritmo base 10. Con SHIFT, diez elevado a x">
        <span class="tecla__alt" aria-hidden="true">10ˣ</span><span>log</span>
      </button>
      <button type="button" class="tecla tecla--fn" data-ins="π" data-ins-shift="e" aria-label="Constante pi. Con SHIFT, constante e">
        <span class="tecla__alt" aria-hidden="true">e</span><span>π</span>
      </button>

      <button type="button" class="tecla tecla--fn" data-ins="(" aria-label="Abrir paréntesis">(</button>
      <button type="button" class="tecla tecla--fn" data-ins=")" aria-label="Cerrar paréntesis">)</button>
      <button type="button" class="tecla tecla--fn" data-ins="!" aria-label="Factorial">n!</button>
      <button type="button" class="tecla tecla--fn" data-ins="%" aria-label="Porcentaje">%</button>
      <button type="button" class="tecla tecla--fn" data-ins="E" aria-label="Notación de exponente, por diez elevado a">EXP</button>
      <button type="button" class="tecla tecla--fn" data-ins="Ans" aria-label="Resultado anterior">Ans</button>
    </div>

    <div class="teclado teclado--memoria">
      <button type="button" class="tecla tecla--mem" data-mem="sumar" aria-label="Sumar a la memoria">M+</button>
      <button type="button" class="tecla tecla--mem" data-mem="restar" aria-label="Restar de la memoria">M−</button>
      <button type="button" class="tecla tecla--mem" data-mem="recuperar" aria-label="Insertar la memoria">MR</button>
      <button type="button" class="tecla tecla--mem" data-mem="limpiar" aria-label="Borrar la memoria">MC</button>
    </div>

    <div class="teclado teclado--numerico">
      <button type="button" class="tecla" data-ins="7">7</button>
      <button type="button" class="tecla" data-ins="8">8</button>
      <button type="button" class="tecla" data-ins="9">9</button>
      <button type="button" class="tecla tecla--borrar" data-accion="del" aria-label="Borrar lo anterior al cursor">DEL</button>
      <button type="button" class="tecla tecla--borrar" data-accion="ac" aria-label="Limpiar todo">AC</button>

      <button type="button" class="tecla" data-ins="4">4</button>
      <button type="button" class="tecla" data-ins="5">5</button>
      <button type="button" class="tecla" data-ins="6">6</button>
      <button type="button" class="tecla tecla--op" data-ins="×" aria-label="Multiplicar">×</button>
      <button type="button" class="tecla tecla--op" data-ins="÷" aria-label="Dividir">÷</button>

      <button type="button" class="tecla" data-ins="1">1</button>
      <button type="button" class="tecla" data-ins="2">2</button>
      <button type="button" class="tecla" data-ins="3">3</button>
      <button type="button" class="tecla tecla--op" data-ins="+" aria-label="Sumar">+</button>
      <button type="button" class="tecla tecla--op" data-ins="-" aria-label="Restar">−</button>

      <button type="button" class="tecla" data-ins="0">0</button>
      <button type="button" class="tecla" data-ins="." aria-label="Coma decimal">,</button>
      <button type="button" class="tecla" data-ins="-" aria-label="Signo negativo">(−)</button>
      <button type="button" class="tecla tecla--igual" data-accion="igual" aria-label="Calcular el resultado">=</button>
    </div>

    <section class="caja-historial">
      <div class="caja-historial__cabecera">
        <h2 class="caja-historial__titulo">Historial</h2>
        <button type="button" class="enlace" data-accion="limpiar-historial"
                aria-label="Vaciar el historial de operaciones">Limpiar</button>
      </div>
      <ul class="historial" id="historial"></ul>
    </section>

    <footer class="efemerides">
      <span>π = 3,141592654</span>
      <span>e = 2,718281828</span>
      <span>φ = 1,618033989</span>
    </footer>
  </main>

  <script src="src/expresion.js"></script>
  <script src="src/calculadora.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
