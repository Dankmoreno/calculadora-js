<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Calculadora científica con tema astrológico, sin dependencias.">
  <title>Astrolabio — calculadora sideral</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Capa puramente decorativa: campo estelar, órbitas, zodiaco y fórmulas. -->
  <div class="cosmos" aria-hidden="true">
    <div class="cosmos__estrellas"></div>
    <div class="cosmos__estrellas cosmos__estrellas--lento"></div>
    <div class="cosmos__nebulosa"></div>

    <div class="orbita orbita--1"></div>
    <div class="orbita orbita--2"></div>
    <div class="orbita orbita--3"><span class="planeta"></span></div>

    <div class="zodiaco">
      <span style="--i:0">♈</span><span style="--i:1">♉</span><span style="--i:2">♊</span>
      <span style="--i:3">♋</span><span style="--i:4">♌</span><span style="--i:5">♍</span>
      <span style="--i:6">♎</span><span style="--i:7">♏</span><span style="--i:8">♐</span>
      <span style="--i:9">♑</span><span style="--i:10">♒</span><span style="--i:11">♓</span>
    </div>

    <p class="flotante flotante--1">e<sup>iπ</sup> + 1 = 0</p>
    <p class="flotante flotante--2">T² = 4π²a³ / GM</p>
    <p class="flotante flotante--3">φ = (1 + √5) / 2</p>
    <p class="flotante flotante--4">∮ E · dA = Q / ε₀</p>
    <p class="flotante flotante--5">Δx · Δp ≥ ħ / 2</p>
    <p class="flotante flotante--6">c = 299 792 458 m/s</p>
  </div>

  <main class="panel">
    <header class="cartela">
      <span class="cartela__sello" aria-hidden="true">✦</span>
      <div>
        <h1 class="cartela__titulo">Astrolabio</h1>
        <p class="cartela__sub">calculadora sideral</p>
      </div>
    </header>

    <div class="pantalla">
      <div class="pantalla__barra">
        <span class="insignia" id="indicador-memoria" hidden>M</span>
        <span class="aviso" id="aviso" role="status" aria-live="polite"></span>
        <button type="button" class="insignia insignia--boton" id="indicador-angulo"
                data-accion="angulo">RAD</button>
        <button type="button" class="insignia insignia--boton" data-accion="copiar"
                aria-label="Copiar el resultado al portapapeles">Copiar</button>
      </div>
      <div class="pantalla__contexto" id="contexto"></div>
      <output class="pantalla__actual" id="actual" role="status" aria-live="polite" aria-atomic="true">0</output>
    </div>

    <div class="teclado teclado--ciencia">
      <button type="button" class="tecla tecla--ciencia" data-funcion="sin" aria-label="Seno">sin</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="cos" aria-label="Coseno">cos</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="tan" aria-label="Tangente">tan</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="ln" aria-label="Logaritmo natural">ln</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="log" aria-label="Logaritmo base 10">log</button>

      <button type="button" class="tecla tecla--ciencia" data-funcion="cuadrado" aria-label="Elevar al cuadrado">x²</button>
      <button type="button" class="tecla tecla--ciencia" data-operador="^" aria-label="Elevar a la potencia">xʸ</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="raiz" aria-label="Raíz cuadrada">√</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="inverso" aria-label="Inverso, uno partido por x">1/x</button>
      <button type="button" class="tecla tecla--ciencia" data-funcion="factorial" aria-label="Factorial">n!</button>

      <button type="button" class="tecla tecla--ciencia" data-constante="pi" aria-label="Constante pi">π</button>
      <button type="button" class="tecla tecla--ciencia" data-constante="e" aria-label="Constante e de Euler">e</button>
      <button type="button" class="tecla tecla--memoria" data-memoria="limpiar" aria-label="Borrar la memoria">MC</button>
      <button type="button" class="tecla tecla--memoria" data-memoria="recuperar" aria-label="Recuperar la memoria">MR</button>
      <button type="button" class="tecla tecla--memoria" data-memoria="sumar" aria-label="Sumar a la memoria">M+</button>
    </div>

    <div class="teclado teclado--basico">
      <button type="button" class="tecla tecla--accion" data-accion="limpiar" aria-label="Limpiar todo">AC</button>
      <button type="button" class="tecla tecla--accion" data-accion="borrar" aria-label="Borrar el último dígito">⌫</button>
      <button type="button" class="tecla tecla--accion" data-accion="porcentaje" aria-label="Porcentaje">%</button>
      <button type="button" class="tecla tecla--operador" data-operador="/" aria-label="Dividir">÷</button>

      <button type="button" class="tecla" data-numero="7">7</button>
      <button type="button" class="tecla" data-numero="8">8</button>
      <button type="button" class="tecla" data-numero="9">9</button>
      <button type="button" class="tecla tecla--operador" data-operador="*" aria-label="Multiplicar">×</button>

      <button type="button" class="tecla" data-numero="4">4</button>
      <button type="button" class="tecla" data-numero="5">5</button>
      <button type="button" class="tecla" data-numero="6">6</button>
      <button type="button" class="tecla tecla--operador" data-operador="-" aria-label="Restar">−</button>

      <button type="button" class="tecla" data-numero="1">1</button>
      <button type="button" class="tecla" data-numero="2">2</button>
      <button type="button" class="tecla" data-numero="3">3</button>
      <button type="button" class="tecla tecla--operador" data-operador="+" aria-label="Sumar">+</button>

      <button type="button" class="tecla tecla--ciencia" data-accion="signo" aria-label="Cambiar de signo">±</button>
      <button type="button" class="tecla" data-numero="0">0</button>
      <button type="button" class="tecla" data-accion="punto" aria-label="Coma decimal">,</button>
      <button type="button" class="tecla tecla--igual" data-accion="igual" aria-label="Calcular el resultado">=</button>
    </div>

    <section class="caja-historial">
      <div class="caja-historial__cabecera">
        <h2 class="caja-historial__titulo">Historial</h2>
        <button type="button" class="enlace" data-accion="limpiar-historial"
                aria-label="Vaciar el historial de operaciones">Limpiar</button>
      </div>
      <ul class="historial" id="historial"></ul>
    </section>

    <footer class="efemerides">
      <span>π = 3,14159265359</span>
      <span>e = 2,71828182846</span>
      <span>φ = 1,61803398875</span>
    </footer>
  </main>

  <script src="src/calculadora.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
