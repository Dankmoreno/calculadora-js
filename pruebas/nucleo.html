<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas del controlador</title>
  <link rel="stylesheet" href="estilo-pruebas.css">
</head>
<body>
  <h1>Pruebas del controlador</h1>
  <p class="nota">
    Prueban <code>src/calculadora.js</code>: línea de entrada, cursor, historial,
    memoria, modos y formato. Sin DOM: puedes abrir este archivo directamente.
  </p>
  <pre id="salida">ejecutando…</pre>

  <script src="../src/expresion.js"></script>
  <script src="../src/calculadora.js"></script>
  <script src="marco.js"></script>
  <script>
    const P = window.Pruebas;
    const C = window.Calculadora;

    const nueva = () => C.crear();
    const teclear = (c, texto) => String(texto).split("").forEach((ch) => c.insertar(ch));

    // Escribe una expresión y la resuelve.
    function resolver(texto) {
      const c = nueva();
      teclear(c, texto);
      c.igual();
      return c.estado();
    }

    P.seccion("FORMATO DE PANTALLA");
    P.comparar("entero", C.formatear(56), "56");
    P.comparar("decimal con coma", C.formatear(2.5), "2,5");
    P.comparar("cero", C.formatear(0), "0");
    P.comparar("negativo", C.formatear(-3), "-3");
    P.comparar("recorte a 10 cifras", C.formatear(1 / 3), "0,3333333333");
    P.comparar("ruido de coma flotante absorbido", C.formatear(0.1 + 0.2), "0,3");
    P.comparar("científica por arriba", C.formatear(1234567890123), "1,23456789×10¹²");
    P.comparar("científica por abajo", C.formatear(1e-13), "1×10⁻¹³");
    P.comparar("no finito", C.formatear(Infinity), "Math ERROR");

    P.seccion("LÍNEA DE ENTRADA Y CURSOR");
    (function () {
      const c = nueva();
      teclear(c, "12+3");
      P.comparar("se escribe de izquierda a derecha", c.estado().entrada, "12+3");
      P.comparar("el cursor queda al final", String(c.estado().cursor), "4");

      c.mover(-1);
      P.comparar("◀ retrocede el cursor", String(c.estado().cursor), "3");
      c.insertar("9");
      P.comparar("se inserta en el cursor", c.estado().entrada, "12+93");

      c.mover(-99);
      P.comparar("el cursor no pasa del inicio", String(c.estado().cursor), "0");
      c.mover(99);
      P.comparar("ni del final", String(c.estado().cursor), "5");
    })();

    (function () {
      const c = nueva();
      c.insertar("2"); c.insertar("×"); c.insertar("sin(");
      P.comparar("una función entra entera", c.estado().entrada, "2×sin(");
      c.borrar();
      P.comparar("DEL borra el token completo, no un carácter", c.estado().entrada, "2×");
      c.borrar();
      P.comparar("y luego el operador", c.estado().entrada, "2");
    })();

    (function () {
      const c = nueva();
      teclear(c, "5+5");
      c.limpiarTodo();
      const e = c.estado();
      P.comparar("AC vacía la entrada", e.entrada, "");
      P.comparar("AC deja el cursor en cero", String(e.cursor), "0");
      P.comparar("AC borra el resultado", e.resultado, "");
    })();

    P.seccion("LA COMA EN PANTALLA");
    (function () {
      const c = nueva();
      teclear(c, "1.5+2.5");
      P.comparar("el punto se muestra como coma", c.estado().entrada, "1,5+2,5");
      c.igual();
      P.comparar("y el resultado también", c.estado().resultado, "4");
    })();

    P.seccion("RESOLVER");
    P.comparar("respeta la precedencia", resolver("2+3×4").resultado, "14");
    P.comparar("con paréntesis", resolver("(2+3)×4").resultado, "20");
    P.comparar("potencia", resolver("2^10").resultado, "1024");
    P.comparar("función", resolver("sin(30").resultado, "0,5");
    P.comparar("porcentaje relativo", resolver("100+10%").resultado, "110");
    P.comparar("factorial", resolver("5!").resultado, "120");
    P.comparar("igual sin nada escrito no hace nada", (() => {
      const c = nueva(); c.igual(); return c.estado().resultado;
    })(), "");

    P.seccion("ERRORES");
    (function () {
      const e = resolver("2+");
      P.comparar("expresión incompleta", e.error, "Syntax ERROR");
      P.comparar("la expresión se conserva para corregirla", e.entrada, "2+");
      P.comparar("sin resultado", e.resultado, "");
    })();
    P.comparar("división entre cero", resolver("5÷0").error, "Math ERROR");
    P.comparar("raíz de un negativo", resolver("√-4").error, "Math ERROR");
    P.comparar("símbolo desconocido", resolver("2&3").error, "Syntax ERROR");
    (function () {
      const c = nueva();
      teclear(c, "2+");
      c.igual();
      c.insertar("3");
      P.comparar("escribir despeja el error", c.estado().error, "");
      c.igual();
      P.comparar("y la expresión corregida se resuelve", c.estado().resultado, "5");
    })();

    P.seccion("CONTINUAR DESDE EL RESULTADO (Ans)");
    (function () {
      const c = nueva();
      teclear(c, "7×8"); c.igual();
      P.comparar("resultado", c.estado().resultado, "56");
      c.insertar("+");
      P.comparar("un operador encadena con Ans", c.estado().entrada, "Ans+");
      teclear(c, "4"); c.igual();
      P.comparar("y se resuelve sobre el anterior", c.estado().resultado, "60");
    })();
    (function () {
      const c = nueva();
      teclear(c, "7×8"); c.igual();
      c.insertar("3");
      P.comparar("un dígito empieza una expresión nueva", c.estado().entrada, "3");
    })();
    (function () {
      const c = nueva();
      teclear(c, "2+2"); c.igual();
      c.insertar("Ans"); c.insertar("×"); c.insertar("3"); c.igual();
      P.comparar("Ans se puede escribir a mano", c.estado().resultado, "12");
    })();

    P.seccion("VISTA PREVIA EN VIVO");
    (function () {
      const c = nueva();
      teclear(c, "2+3");
      P.comparar("mientras escribes muestra el valor", c.estado().vistaPrevia, "5");
      teclear(c, "×");
      P.comparar("si queda incompleta, no muestra nada", c.estado().vistaPrevia, "");
      c.limpiarTodo();
      P.comparar("con la entrada vacía tampoco", c.estado().vistaPrevia, "");
      teclear(c, "1+1"); c.igual();
      P.comparar("tras = manda el resultado, no la vista previa", c.estado().vistaPrevia, "");
    })();

    P.seccion("MODO ANGULAR");
    (function () {
      const c = nueva();
      P.comparar("arranca en grados", c.estado().angulo, "DEG");
      c.alternarAngulo();
      P.comparar("pasa a radianes", c.estado().angulo, "RAD");
      c.alternarAngulo();
      P.comparar("luego a gradianes", c.estado().angulo, "GRA");
      c.alternarAngulo();
      P.comparar("y vuelve a grados", c.estado().angulo, "DEG");
    })();
    (function () {
      const c = nueva();
      teclear(c, "sin(90"); c.igual();
      P.comparar("sen(90) en grados", c.estado().resultado, "1");
      const r = nueva();
      r.alternarAngulo();
      teclear(r, "sin(0"); r.igual();
      P.comparar("sen(0) en radianes", r.estado().resultado, "0");
    })();

    P.seccion("SHIFT");
    (function () {
      const c = nueva();
      P.comparar("apagado al arrancar", String(c.estado().shift), "false");
      c.alternarShift();
      P.comparar("se enciende", String(c.estado().shift), "true");
      c.alternarShift();
      P.comparar("y se apaga", String(c.estado().shift), "false");
    })();

    P.seccion("MEMORIA");
    (function () {
      const c = nueva();
      P.comparar("arranca vacía", String(c.estado().tieneMemoria), "false");
      teclear(c, "12"); c.memoria("sumar");
      P.comparar("M+ guarda la expresión evaluada", String(c.estado().memoria), "12");
      P.comparar("y enciende el indicador", String(c.estado().tieneMemoria), "true");

      c.limpiarTodo(); teclear(c, "5"); c.memoria("sumar");
      P.comparar("M+ acumula", String(c.estado().memoria), "17");

      c.limpiarTodo(); teclear(c, "7"); c.memoria("restar");
      P.comparar("M− resta", String(c.estado().memoria), "10");

      c.limpiarTodo(); c.memoria("recuperar");
      P.comparar("MR inserta la variable M", c.estado().entrada, "M");
      c.insertar("×"); c.insertar("2"); c.igual();
      P.comparar("y M vale lo guardado", c.estado().resultado, "20");

      c.memoria("limpiar");
      P.comparar("MC la borra", String(c.estado().memoria), "0");
      P.comparar("y apaga el indicador", String(c.estado().tieneMemoria), "false");
    })();
    (function () {
      const c = nueva();
      teclear(c, "2+");
      c.memoria("sumar");
      P.comparar("M+ sobre una expresión rota avisa del error", c.estado().error, "Syntax ERROR");
      P.comparar("y no toca la memoria", String(c.estado().memoria), "0");
    })();

    P.seccion("HISTORIAL");
    (function () {
      const c = nueva();
      teclear(c, "7×8"); c.igual();
      c.limpiarTodo(); teclear(c, "10-4"); c.igual();

      const h = c.estado().historial;
      P.comparar("guarda las dos", String(h.length), "2");
      P.comparar("la más reciente primero", h[0].expresion, "10-4");
      P.comparar("con su resultado", h[0].resultado, "6");
      P.comparar("y conserva la anterior", h[1].expresion, "7×8");

      c.limpiarTodo();
      c.recorrerHistorial(1);
      P.comparar("▲ recupera la última", c.estado().entrada, "10-4");
      c.recorrerHistorial(1);
      P.comparar("▲ otra vez, la anterior", c.estado().entrada, "7×8");
      c.recorrerHistorial(1);
      P.comparar("▲ al final del historial se queda", c.estado().entrada, "7×8");
      c.recorrerHistorial(-1);
      P.comparar("▼ vuelve hacia delante", c.estado().entrada, "10-4");

      c.limpiarHistorial();
      P.comparar("se puede vaciar", String(c.estado().historial.length), "0");
    })();
    (function () {
      const c = nueva();
      teclear(c, "2+"); c.igual();
      P.comparar("una expresión con error no entra al historial",
        String(c.estado().historial.length), "0");
    })();

    P.seccion("LÍMITE DE LONGITUD");
    (function () {
      const c = nueva();
      for (let i = 0; i < C.LARGO_MAXIMO + 40; i++) c.insertar("1");
      P.comparar("la entrada se corta en el máximo",
        String(c.estado().entrada.length), String(C.LARGO_MAXIMO));
    })();

    P.publicar();
  </script>
</body>
</html>
